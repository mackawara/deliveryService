<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Baseline content security policy for the static bundle. The hosting layer should
      send the same policy as a response header; see deploy/nginx.conf.example.
      style-src allows inline styles because MUI/Emotion injects component styles at runtime.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>Delivery Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The delivery dashboard requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
