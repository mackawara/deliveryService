name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Roll back to a verified earlier deployment: its run id from `deploy.sh status` on the server. Skips CI and the build; the recorded digest is pulled again from Docker Hub.'
        required: false
        type: string

# Never run two deploys at once. A newer push replaces a run that is still
# waiting its turn, but a deployment already running is never cancelled.
# deploy.sh also locks on the server, which covers the API workflow in
# deliveryBooking.
concurrency:
  group: deploy-delivery-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1. The required checks, for exactly this commit.
  ci:
    if: ${{ !inputs.rollback_to }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # CodeQL (and any other required analysis) runs in its own workflow on the
  # same push. Wait for its result on THIS sha; a result from another commit
  # never counts.
  external-checks:
    name: Require analysis checks for this commit
    if: ${{ !inputs.rollback_to }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Wait for the required checks on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Comma-separated extra check/status names, e.g. the Codacy status.
          REQUIRED_STATUS_CHECKS: ${{ vars.REQUIRED_STATUS_CHECKS }}
        run: |
          # This repository is public, so its CodeQL checks are always required.
          required=("Analyze (javascript-typescript)" "Analyze (actions)")
          if [ -n "${REQUIRED_STATUS_CHECKS}" ]; then
            IFS=',' read -r -a extra <<<"${REQUIRED_STATUS_CHECKS}"
            for name in "${extra[@]}"; do required+=("$(xargs <<<"${name}")"); done
          fi
          .github/scripts/require-checks.sh "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" 1500 "${required[@]}"

  # 2. Decide the version without creating anything.
  plan:
    name: Plan the release
    needs: [ci, external-checks]
    if: ${{ !cancelled() && !inputs.rollback_to && needs.ci.result == 'success' && needs.external-checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # semantic-release's dry run verifies it could push the release tag.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      semver_tag: ${{ steps.plan.outputs.semver_tag }}
      new_release: ${{ steps.plan.outputs.new_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/plan-release.sh

  # 3. Build on a GitHub arm64 runner (never on the VM), exercise the image,
  #    then push the immutable commit tag and, for a release, the SemVer tag.
  publish:
    name: Build and publish the image
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Public build configuration only. The Maps key is a browser key restricted
      # to the dashboard origin and the Maps JavaScript API; no server or
      # provider secret is passed to the build.
      - id: publish
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/delivery-dashboard
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          SEMVER_TAG: ${{ needs.plan.outputs.semver_tag }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          VITE_APP_LABEL: ${{ vars.VITE_APP_LABEL }}
          VITE_DEFAULT_THEME: ${{ vars.VITE_DEFAULT_THEME }}
          VITE_DEFAULT_PHONE_COUNTRY: ${{ vars.VITE_DEFAULT_PHONE_COUNTRY }}
          VITE_DEFAULT_TIMEZONE: ${{ vars.VITE_DEFAULT_TIMEZONE }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .github/scripts/publish-image.sh

  # 4. Git tag and GitHub Release notes, only once the image exists. No
  #    version commit is made, so protected main is never bypassed.
  release:
    name: Tag and publish release notes
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.new_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes -p semantic-release@24.2.7 -p conventional-changelog-conventionalcommits@8.0.1 semantic-release --no-ci
      - name: The release tag must be the version the image was built as
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git fetch --tags --force
          git tag --points-at HEAD | grep -qx "v${VERSION}" || {
            echo "::error::HEAD is not tagged v${VERSION}; the released version differs from the published image." >&2
            exit 1
          }

  # 5. Only the newest eligible revision is deployed.
  guard:
    name: Check this is still the newest revision
    needs: [plan, publish, release]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.newest.outputs.proceed }}
    steps:
      - id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "${head}" = "${GITHUB_SHA}" ]; then
            echo "proceed=true" >>"${GITHUB_OUTPUT}"
          else
            echo "::notice::main has moved on to ${head}; ${GITHUB_SHA} is superseded and will not be deployed (its image stays published)."
            echo "proceed=false" >>"${GITHUB_OUTPUT}"
          fi

  # 6. Activate, verify, then accept or roll back.
  deploy:
    needs: [plan, publish, guard]
    if: ${{ !cancelled() && needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    # deploy.sh may wait up to 15 minutes for an API activation to be accepted,
    # and the smoke checks retry for several more.
    timeout-minutes: 40
    environment: production
    env:
      # The compose stack and deploy.sh are owned by deliveryBooking; its Deploy
      # API workflow must have run at least once. Never grocery's
      # /home/ubuntu/repos/saas.
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/repos/delivery' }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/delivery-dashboard
      DIGEST: ${{ needs.publish.outputs.digest }}
      VERSION: ${{ needs.plan.outputs.version }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # The compose bundle this release was written against; deploy.sh refuses
      # it if the server's active bundle is a different schema.
      BUNDLE_SCHEMA: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}

      # Refuses to use another stack's deploy.sh: grocery's also has a
      # "dashboard" service, and this image must never replace it.
      - name: Check the server has the delivery stack and its bundle
        run: |
          ssh deploy-host bash -s -- "$(printf '%q' "${DEPLOY_PATH}")" <<'REMOTE'
          set -euo pipefail
          if ! cd "$1" 2>/dev/null || [ "$(cat .stack-name 2>/dev/null)" != delivery ] || [ ! -f deploy.sh ]; then
            echo "::error::$1 is not the delivery stack, or the API has not been deployed yet. Run the deliveryBooking Deploy API workflow first, or check the DEPLOY_PATH variable." >&2
            exit 1
          fi
          REMOTE

      - name: Activate (lock, disk check, pull by digest, replace the dashboard)
        id: activate
        run: |
          # Expanded here on purpose; %q quotes the values for the remote shell.
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") activate \
            --service dashboard --image $(printf '%q' "${IMAGE}") --digest $(printf '%q' "${DIGEST}") \
            --version $(printf '%q' "${VERSION}") --revision ${GITHUB_SHA} --run ${RUN_ID} \
            --bundle-schema ${BUNDLE_SCHEMA}"

      # The second acceptance gate: HTTPS from outside the VM, asserting the
      # exact version and revision. The first was the container readiness
      # inside `activate`.
      - name: HTTPS smoke checks
        env:
          DASHBOARD_ORIGIN: ${{ vars.PUBLIC_BASE_URL }}
        run: .github/scripts/smoke.sh "${DASHBOARD_ORIGIN}" "${VERSION}" "${GITHUB_SHA}"

      - name: Accept (record the version pair, remove obsolete local images)
        id: accept
        run: |
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") accept --run ${RUN_ID}"

      # Either gate failing restores the previous dashboard from the image
      # that is still on the VM; the API is never touched.
      - name: Roll back
        if: ${{ always() && steps.activate.outcome == 'success' && steps.accept.outcome != 'success' }}
        run: |
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") rollback --run ${RUN_ID}"
          echo "::error::The deployment failed acceptance and was rolled back." >&2
          exit 1

      - name: Record
        if: ${{ always() }}
        run: |
          {
            echo "### Deploy Dashboard"
            echo "- version: \`${VERSION}\`  revision: \`${GITHUB_SHA}\`"
            echo "- image: \`${IMAGE}@${DIGEST}\`"
            echo "- run: \`${RUN_ID}\`"
            echo '```'
            ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") status" 2>&1 || true
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

  # Manual rollback to a verified earlier deployment. Skips CI and the build:
  # the recorded dashboard digest is pulled again from Docker Hub (cleanup
  # removed it locally); the API and its settings are left as they are.
  rollback:
    name: Roll back to a recorded deployment
    if: ${{ inputs.rollback_to }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/repos/delivery' }}
      RECORD: ${{ inputs.rollback_to }}
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ssh-setup
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}

      - name: Read the verified record
        id: record
        run: |
          [[ "${RECORD}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::invalid record id" >&2; exit 1; }
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") record --record ${RECORD}" | tee record.env
          {
            echo "version=$(grep '^DASHBOARD_VERSION=' record.env | cut -d= -f2-)"
            echo "revision=$(grep '^DASHBOARD_REVISION=' record.env | cut -d= -f2-)"
          } >>"${GITHUB_OUTPUT}"

      - name: Activate the recorded release
        id: activate
        run: |
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") rollback-to --service dashboard --record ${RECORD} --run ${RUN_ID}"

      - name: HTTPS smoke checks
        env:
          DASHBOARD_ORIGIN: ${{ vars.PUBLIC_BASE_URL }}
          EXPECTED_VERSION: ${{ steps.record.outputs.version }}
          EXPECTED_REVISION: ${{ steps.record.outputs.revision }}
        run: .github/scripts/smoke.sh "${DASHBOARD_ORIGIN}" "${EXPECTED_VERSION}" "${EXPECTED_REVISION}"

      - name: Accept
        id: accept
        run: |
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") accept --run ${RUN_ID}"

      - name: Roll back the rollback
        if: ${{ always() && steps.activate.outcome == 'success' && steps.accept.outcome != 'success' }}
        run: |
          # shellcheck disable=SC2029
          ssh deploy-host "DELIVERY_ROOT=$(printf '%q' "${DEPLOY_PATH}") bash $(printf '%q' "${DEPLOY_PATH}/deploy.sh") rollback --run ${RUN_ID}"
          exit 1
