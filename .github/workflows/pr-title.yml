name: PR title

# The squash-merge title is the commit message semantic-release reads, so it
# must be a Conventional Commit. Runs only on PR metadata; no checkout and no
# secrets, so it is safe with pull_request_target.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            build
            docs
            ci
            chore
            test
            style
            refactor
