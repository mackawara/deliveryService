name: CI

on:
  push:
    # main runs this through the deploy workflow, which calls it before building
    # an image, so main is never deployed without it passing.
    branches-ignore: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only everywhere. Nothing here uses registry, SSH, WhatsApp, Paynow or
# Atlas credentials, so a pull request cannot reach them even if its code runs.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, doctor, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Codacy needs a token; fork pull requests never receive it.
      CODACY_PROJECT_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CODACY_PROJECT_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-line coverage report diffs against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Node satisfies package.json engines (>=22.13)
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a<22||(a===22&&b<13)) { console.error('Node '+process.versions.node+' is older than the 22.13 minimum'); process.exit(1) }"

      - name: Enable Corepack
        run: corepack enable

      # `--immutable` fails the build if yarn.lock does not match package.json.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: ESLint
        run: yarn lint

      # Shell is where the deployment logic lives; ShellCheck is preinstalled on
      # GitHub's runners. Warnings and errors fail the build.
      - name: ShellCheck
        run: shellcheck --severity=warning .github/scripts/*.sh

      - name: Prettier
        run: yarn format

      # Pinned react-doctor 0.9.18, run directly (not the Action): errors block,
      # warnings stay visible, scanner failures fail. Findings are in the log and
      # the uploaded report.
      - name: React Doctor
        run: yarn doctor:check

      - name: Upload React Doctor report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: doctor-report
          path: doctor-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Unit, component and integration tests with coverage
        run: yarn test:coverage

      - name: Build
        run: yarn build

      - name: The bundle carries no mocks or server secrets
        run: node scripts/check-dist.mjs dist

      - name: Changed-line coverage
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Report-only until the main baseline is validated; then set the
          # repository variable to true to enforce 80% on changed lines.
          ENFORCE: ${{ vars.ENFORCE_CHANGED_LINE_COVERAGE == 'true' && '--enforce' || '' }}
          BASE_REF: origin/${{ github.base_ref }}
        run: node .github/scripts/changed-line-coverage.mjs coverage/lcov.info "${BASE_REF}" --min 80 ${ENFORCE}

      # Codacy's own reporter script (their documented route) rather than a
      # third-party action. The token reaches this step only on pushes and
      # same-repository PRs; fork PRs have none, so the step is skipped.
      - name: Upload coverage to Codacy
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        env:
          # A pull request runs on a synthetic merge commit; Codacy must file
          # the report under the commit its PR analysis is about.
          COMMIT_UUID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --commit-uuid "${COMMIT_UUID}" -r coverage/lcov.info

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      # The end-to-end suite runs against the mock API, which serves the documented
      # contracts. Production-image behaviour is verified separately (container
      # smoke test and public HTTPS smoke checks).
      - name: Run Playwright tests
        run: yarn test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    # On main the deploy workflow builds, smoke-tests and pushes the real
    # image, so only pull requests need the dry run. It needs no registry or
    # deployment credentials: the image is built and run locally, never pushed.
    if: ${{ github.event_name == 'pull_request' }}
    # Same arm64 platform as production, so the build cache is shared with it.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: delivery-dashboard:ci
          build-args: |
            APP_VERSION=0.0.0-ci
            APP_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
            APP_BUILD_TIME=2026-01-01T00:00:00Z
          cache-from: type=gha

      - name: Run the production image
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/container-smoke.sh delivery-dashboard:ci 0.0.0-ci "${REVISION}"

  # The one check branch protection and the release workflow depend on. It
  # fails if any job it covers failed, was cancelled or was skipped when it
  # should have run, so a green result means every gate passed for this commit.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [verify, e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `docker` is intentionally skipped outside pull requests.
          echo "${RESULTS}" | jq -e --arg event "${EVENT}" '
            to_entries
            | all(.value.result == "success" or (.key == "docker" and $event != "pull_request" and .value.result == "skipped"))
          ' >/dev/null
